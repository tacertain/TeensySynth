[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = 
	; -DSF22ASWT_DEBUG
	; -DUSB_MTPDISK_SERIAL ; Can only have one of MTP and AUDIO defined
	; -DUSB_AUDIO
lib_deps = 
	USBHost_t36
	ILI9341_t4
	adafruit/Adafruit GFX Library@^1.12.1
	manicken/sf22aswt@^0.1.5
